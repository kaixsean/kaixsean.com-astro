services:
  blog:
    build:
      context: .
      target: dev
    container_name: kaixsean-blog-dev
    ports:
      - "4321:4321"
    volumes:
      # Mount source for hot-reload during development
      - .:/app
      # Prevent host node_modules from overriding container's
      - /app/node_modules
      # Isolate .astro cache to avoid stale dev server lock files
      - /app/.astro
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
